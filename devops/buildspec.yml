version: 0.2

env:
  secrets-manager:
    SONAR_LOGIN: sonar:LOGIN
    SONAR_HOST: sonar:HOST
    SONAR_ORGANIZATION: sonar:ORGANIZATION
  variables:
    SOURCE_SRC: "src"
    SONAR_PROJECTKEY: "Cloud2gether_Cloud2Gether.Documentation"
    HUGO_VERSION: "0.152.2"
    GO_VERSION: "1.21.6"
phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== Installing Hugo Extended ==="
      - wget -q https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
      - tar -C /usr/local/bin -xzf hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz hugo
      - hugo version

      - echo "=== Installing Go (required for Hugo modules) ==="
      - wget -q https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz
      - tar -C /usr/local -xzf go${GO_VERSION}.linux-amd64.tar.gz
      - ln -sf /usr/local/go/bin/go /usr/local/bin/go
      - go version

      - echo "=== Installing PostCSS dependencies ==="
      - cd $CODEBUILD_SRC_DIR/$SOURCE_SRC && npm install

      - echo "=== Fetching Hugo modules (Docsy) ==="
      - cd $CODEBUILD_SRC_DIR/$SOURCE_SRC && hugo mod get
  pre_build:
    commands:
      - echo "Executing pre-build phase"
      - wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389-linux-x64.zip
      - unzip -q ./sonar-scanner-cli-8.1.0.6389-linux-x64.zip -d /usr/local/
      - ln -sf /usr/local/sonar-scanner-8.1.0.6389-linux-x64/bin/sonar-scanner /usr/local/bin/sonar-scanner
      - export PULLREQUEST_NUMBER=$(echo $CODEBUILD_WEBHOOK_TRIGGER | grep "pr/" | cut -d "/" -f2)
  build:
    commands:
      - echo "Executing build phase"
      - cd $CODEBUILD_SRC_DIR/$SOURCE_SRC
      - hugo --gc --minify
      - echo $PULLREQUEST_NUMBER
      - if [ -z "$PULLREQUEST_NUMBER" ] ;
        then
          sonar-scanner -Dsonar.login=$SONAR_LOGIN -Dsonar.host.url=$SONAR_HOST -Dsonar.projectKey=$SONAR_PROJECTKEY -Dsonar.organization=$SONAR_ORGANIZATION -Dsonar.sources=$CODEBUILD_SRC_DIR/$SOURCE_SRC/public;
        else
          sonar-scanner -Dsonar.login=$SONAR_LOGIN -Dsonar.host.url=$SONAR_HOST -Dsonar.projectKey=$SONAR_PROJECTKEY -Dsonar.organization=$SONAR_ORGANIZATION -Dsonar.sources=$CODEBUILD_SRC_DIR/$SOURCE_SRC/public -Dsonar.pullrequest.key=$PULLREQUEST_NUMBER;
        fi
      - sleep 15
      - curl -u $SONAR_LOGIN:"" https://sonarcloud.io/api/qualitygates/project_status?projectKey=$SONAR_PROJECTKEY >result.json
      - cat result.json
artifacts:
  discard-paths: no
  base-directory: src/public
  files:
    - "**/*"
